name: Build G Sterling Press OBSIDIAN 002 APK

on:
  push:
    branches: [theme/obsidian-002]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify OBSIDIAN inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/obsidian_002_home.jpg
          test -s app/src/main/res/drawable-nodpi/obsidian_002_lock.jpg
          grep -q "com.gsterling.press.obsidian002" app/build.gradle
          grep -q "R.drawable.obsidian_002_home" app/src/main/java/com/gsterling/press/MainActivity.java
          grep -q "R.drawable.obsidian_002_lock" app/src/main/java/com/gsterling/press/MainActivity.java
      - name: Real Gradle build
        run: gradle clean assembleDebug --stacktrace
      - name: Validate and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p phone-test
          cp "$APK" phone-test/G_STERLING_PRESS_OBSIDIAN_002.apk
          sha256sum phone-test/G_STERLING_PRESS_OBSIDIAN_002.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G_STERLING_PRESS_OBSIDIAN_002
          path: phone-test/G_STERLING_PRESS_OBSIDIAN_002.apk
          if-no-files-found: error
