name: Build G Sterling Press APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Recover locked ABYSS masters from authoritative factory ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="G_STERLING_PRESS_COLLECTION_FACTORY_V1_SOURCE.zip"
          test -f "$ZIP"
          rm -rf /tmp/gsp_factory && mkdir -p /tmp/gsp_factory
          unzip -q "$ZIP" -d /tmp/gsp_factory
          echo "Factory artwork candidates:"
          find /tmp/gsp_factory -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -printf '%p %s bytes\n'
          HOME_SRC="$(find /tmp/gsp_factory -type f -iname 'abyss_001_home_clockfree.png' -print -quit)"
          LOCK_SRC="$(find /tmp/gsp_factory -type f -iname 'abyss_001_lock_clockfree.png' -print -quit)"
          if [ -z "$HOME_SRC" ]; then
            HOME_SRC="$(find /tmp/gsp_factory -type f \( -iname '*abyss*home*.png' -o -iname '*home*clockfree*.png' \) -print -quit)"
          fi
          if [ -z "$LOCK_SRC" ]; then
            LOCK_SRC="$(find /tmp/gsp_factory -type f \( -iname '*abyss*lock*.png' -o -iname '*lock*clockfree*.png' \) -print -quit)"
          fi
          test -n "$HOME_SRC" || { echo "LOCKED HOME MASTER NOT FOUND"; exit 31; }
          test -n "$LOCK_SRC" || { echo "LOCKED LOCK MASTER NOT FOUND"; exit 32; }
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$HOME_SRC" app/src/main/res/drawable-nodpi/abyss_001_home_clockfree.png
          cp "$LOCK_SRC" app/src/main/res/drawable-nodpi/abyss_001_lock_clockfree.png
          test -s app/src/main/res/drawable-nodpi/abyss_001_home_clockfree.png
          test -s app/src/main/res/drawable-nodpi/abyss_001_lock_clockfree.png
          sha256sum app/src/main/res/drawable-nodpi/abyss_001_*_clockfree.png

      - name: Verify ABYSS 001 acceptance inputs
        run: |
          test -f settings.gradle
          test -f app/src/main/assets/collection_001_abyss.json
          ! grep -R "IMPORT .GSTHEME" app/src/main
          test -f app/src/main/res/drawable-nodpi/abyss_001_home_clockfree.png
          test -f app/src/main/res/drawable-nodpi/abyss_001_lock_clockfree.png
          grep -q "R.drawable.abyss_001_home_clockfree" app/src/main/java/com/gsterling/press/MainActivity.java
          grep -q "R.drawable.abyss_001_lock_clockfree" app/src/main/java/com/gsterling/press/MainActivity.java

      - name: Build phone-test APK
        run: gradle clean assembleDebug --stacktrace

      - name: Name APK
        run: |
          mkdir -p phone-test
          cp app/build/outputs/apk/debug/app-debug.apk phone-test/G_STERLING_PRESS_ONE_TAP_V1.apk
          sha256sum phone-test/G_STERLING_PRESS_ONE_TAP_V1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: G_STERLING_PRESS_ONE_TAP_V1
          path: phone-test/G_STERLING_PRESS_ONE_TAP_V1.apk
          if-no-files-found: error
