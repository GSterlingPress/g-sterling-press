name: Build G Sterling Press BLACK TIDE NEW HORIZON APK

on:
  push:
    branches: [theme/black-tide-new-horizon]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Restore BLACK TIDE artwork
        shell: bash
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          python -c "import base64,pathlib; pathlib.Path('app/src/main/res/drawable-nodpi/black_tide_home.jpg').write_bytes(base64.b64decode(pathlib.Path('factory/assets/black_tide_home.b64').read_text()))"
          python -c "import base64,pathlib; pathlib.Path('app/src/main/res/drawable-nodpi/black_tide_lock.jpg').write_bytes(base64.b64decode(pathlib.Path('factory/assets/black_tide_lock.b64').read_text()))"
      - name: Verify BLACK TIDE inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/res/drawable-nodpi/black_tide_home.jpg
          test -s app/src/main/res/drawable-nodpi/black_tide_lock.jpg
          grep -q "com.gsterling.press.blacktide.newhorizon" app/build.gradle
          grep -q "R.drawable.black_tide_home" app/src/main/java/com/gsterling/press/MainActivity.java
          grep -q "R.drawable.black_tide_lock" app/src/main/java/com/gsterling/press/MainActivity.java
      - name: Real Gradle build
        run: gradle clean assembleDebug --stacktrace
      - name: Validate and name APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          /usr/local/lib/android/sdk/build-tools/35.0.0/apksigner verify --verbose "$APK"
          mkdir -p phone-test
          cp "$APK" phone-test/G_STERLING_BLACK_TIDE_NEW_HORIZON.apk
          sha256sum phone-test/G_STERLING_BLACK_TIDE_NEW_HORIZON.apk
      - uses: actions/upload-artifact@v4
        with:
          name: G_STERLING_BLACK_TIDE_NEW_HORIZON
          path: phone-test/G_STERLING_BLACK_TIDE_NEW_HORIZON.apk
          if-no-files-found: error
